# NOTE: this block is NOT used. The lifecycle manager runs as
# 'lifecycle_manager_navigation' and takes its parameters INLINE from
# minimal_navigation_launch.py, so the node name here does not match and
# nothing below is applied. Edit the launch file instead (that is where
# bond_timeout lives). Kept only as documentation of the managed set.
# Recovery behaviours. Previously absent entirely: the behaviour tree called
# Spin / BackUp / Wait / DriveOnHeading, found no action server, and the goal was
# aborted the instant the footprint touched a lethal cell -- even with no actual
# collision and plenty of room to back off and retry.
#
# BackUp is the one that matters here: it is what lets the robot reverse out of a
# cell its footprint should never have been in. simulate_ahead_time makes the
# behaviours check the costmap before moving, so they are not blind.
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    # Check 2s of motion against the costmap before executing, so a recovery
    # cannot drive into something the robot can already see.
    simulate_ahead_time: 2.0
    # Matched to the base's real capability (measured 0.35 m/s, 1.18 m/s^2);
    # the nav2 defaults assume a much faster robot and overshoot in this lab.
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.2

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - bt_navigator
